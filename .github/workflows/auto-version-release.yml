name: Auto Version Release

# Manual only. Pushing to main used to cut a tag on every commit, which now
# would submit a Chrome Web Store review each time. Releases are deliberate:
# either run this workflow, or tag vMAJOR.MINOR.PATCH locally and push it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-version-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BUMP: ${{ inputs.bump }}

jobs:
  prepare-release:
    name: Bump version and changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Root package only, same as the release job — see release-extension.yml.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Prepare version and changelog
        id: release
        run: pnpm run release:prepare

      - name: Lint
        if: steps.release.outputs.changed == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.release.outputs.changed == 'true'
        run: pnpm typecheck

      - name: Unit test
        if: steps.release.outputs.changed == 'true'
        run: pnpm test

      - name: Check brand assets
        if: steps.release.outputs.changed == 'true'
        run: pnpm brand:check

      - name: Build extension
        if: steps.release.outputs.changed == 'true'
        run: pnpm build

      - name: Install Playwright Chromium
        if: steps.release.outputs.changed == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end test
        if: steps.release.outputs.changed == 'true'
        run: pnpm test:e2e:run

      - name: Commit version and tag
        if: steps.release.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.release.outputs.tag }}"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "${{ steps.release.outputs.tag }}"

      # Tags pushed with GITHUB_TOKEN never fire on-push workflows, so the release
      # build must be dispatched explicitly (API dispatch is exempt from that rule).
      - name: Trigger extension release
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-extension.yml --ref "${{ steps.release.outputs.tag }}" -f tag="${{ steps.release.outputs.tag }}"
