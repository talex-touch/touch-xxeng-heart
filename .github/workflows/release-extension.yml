name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.4
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    name: Build and publish extension package
    runs-on: ubuntu-latest
    outputs:
      asset_name: ${{ steps.asset.outputs.asset_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $VERSION" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --ignore-workspace: every step below builds the extension from the root
      # package only. Installing apps/* as well would couple the extension release
      # to the landing page's dependency tree for no benefit.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      - name: Check brand assets
        run: pnpm brand:check

      - name: Build extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end test
        run: pnpm test:e2e:run

      - name: Pack extension zip
        run: pnpm pack:zip

      - name: Rename release asset
        id: asset
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ASSET_NAME="touch-xxeng-heart-extension-v${VERSION}.zip"
          mv extension.zip "$ASSET_NAME"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset.outputs.asset_name }}
          path: ${{ steps.asset.outputs.asset_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.asset.outputs.asset_name }}
          generate_release_notes: true

  # The store is an external service with its own review queue, its own credentials and
  # its own outage modes, so it gets its own job: a store problem never marks the GitHub
  # Release as failed, and the two outcomes stay readable separately in the run summary.
  # The store only accepts the zip and signs it itself; the local extension.crx is signed
  # with our own key.pem and is for self-hosted installs, so it is deliberately not
  # uploaded here.
  publish-store:
    name: Publish to Chrome Web Store
    needs: build-and-release
    runs-on: ubuntu-latest
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    env:
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      ASSET_NAME: ${{ needs.build-and-release.outputs.asset_name }}

    # A missing secret is a configuration gap, not a broken release: report exactly which
    # names are unset and skip, so the run stays green and the reason is on the summary.
    # A real store failure below still fails this job loudly.
    steps:
      - name: Check the store credentials
        id: credentials
        shell: bash
        run: |
          missing=()
          for name in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN PUBLISHER_ID EXTENSION_ID; do
            if [[ -z "${!name}" ]]; then
              missing+=("CWS_${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            UNLESS_VERB="is"
            if (( ${#missing[@]} > 1 )); then
              UNLESS_VERB="are"
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chrome Web Store upload skipped: ${missing[*]} ${UNLESS_VERB} unset. The GitHub Release for ${RELEASE_TAG} is published and unaffected." >&2
            {
              echo "### Chrome Web Store: skipped"
              echo
              echo "Unset repository secrets: ${missing[*]}."
              echo
              echo "The GitHub Release for \`${RELEASE_TAG}\` is published. Add the secrets and re-run this"
              echo "workflow for the same tag — no new tag or version is needed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.1

      - name: Setup Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the release package
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}

      # Whatever the store rejects, it rejects minutes later and behind an opaque error;
      # checking the tag the package declares first keeps that round trip out of the loop.
      - name: Verify the package matches the tag
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          unzip -p "$ASSET_NAME" manifest.json > packaged-manifest.json
          NAME=$(node -p "require('./packaged-manifest.json').name")
          MANIFEST_VERSION=$(node -p "require('./packaged-manifest.json').version")
          MANIFEST_KIND=$(node -p "require('./packaged-manifest.json').manifest_version")
          if [[ "$MANIFEST_KIND" != "3" ]]; then
            echo "::error::$ASSET_NAME is not a Manifest V3 package." >&2
            exit 1
          fi
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "::error::$ASSET_NAME declares version $MANIFEST_VERSION but the release tag is $RELEASE_TAG." >&2
            exit 1
          fi
          echo "Packaged for the store: $NAME $MANIFEST_VERSION (Manifest V$MANIFEST_KIND)"

      - name: Upload the new version
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          upload() {
            pnpm dlx chrome-webstore-upload-cli@4.0.1 upload \
              --source "$ASSET_NAME" \
              --extension-id "$EXTENSION_ID" \
              --max-await-in-progress 900
          }
          if upload; then
            exit 0
          fi
          echo "::warning::The first upload attempt failed; retrying once in 30s. The upload is a draft until it is published." >&2
          sleep 30
          upload

      - name: Publish the uploaded version
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          pnpm dlx chrome-webstore-upload-cli@4.0.1 publish \
            --extension-id "$EXTENSION_ID" \
            --deploy-percentage 100

      # Independent read of what the store actually holds: the upload command exits 0 even
      # when the revision is still being processed, so the version is read back from the
      # API instead of trusted from the previous step's exit code.
      - name: Read the store version back
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d grant_type=refresh_token > token.json
          ACCESS_TOKEN=$(node -e '
            const response = require("./token.json")
            if (!response.access_token) {
              const reason = [response.error, response.error_description].filter(Boolean).join(": ")
              console.error(`::error::The Chrome Web Store OAuth refresh token did not return an access token — ${reason || "no error reported"}. A refresh token minted without the chromewebstore scope fails here.`)
              process.exit(1)
            }
            process.stdout.write(response.access_token)
          ')
          curl -sS -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}?projection=DRAFT" \
            > store-status.json
          echo "Store reports: $(cat store-status.json)"
          if ! node -e '
            const status = require("./store-status.json")
            const version = process.argv[1]
            if (status.error) {
              console.error(`::error::The Web Store API rejected reading item ${process.env.EXTENSION_ID}: ${JSON.stringify(status.error)}`)
              process.exit(1)
            }
            const reported = [status.crxVersion, status.publishedItemRevisionStatus?.crxVersion].filter(Boolean)
            if (!reported.includes(version)) {
              console.error(`::error::The store does not report version ${version}; it reports ${reported.join(", ") || "nothing"}.`)
              process.exit(1)
            }
            console.log(`The store holds version ${version} (upload state ${status.uploadState ?? "unknown"}).`)
          ' "$VERSION"; then
            exit 1
          fi
          {
            echo "### Chrome Web Store: uploaded"
            echo
            echo "\`${ASSET_NAME}\` matches the store version \`${VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the store outcome
        if: always() && steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            exit 0
          fi
          {
            echo "### Chrome Web Store: not published"
            echo
            echo "The store step failed for \`${RELEASE_TAG}\`. The GitHub Release and its zip are"
            echo "published and unaffected. Fix the store error and re-run this workflow for the"
            echo "same tag."
          } >> "$GITHUB_STEP_SUMMARY"
